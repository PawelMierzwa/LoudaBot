plugins {
    id 'java'
    id 'application'
}

mainClassName = 'Main'

group 'cnsh'
version '2.0.beta'

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    maven {
        name 'm2-duncte123'
        url 'https://m2.duncte123.dev/releases'
    }
    maven {
        url "https://maven.lavalink.dev/releases"
    }
}


dependencies {
    implementation("ch.qos.logback:logback-classic:1.5.6")
    implementation("net.dv8tion:JDA:5.1.2")
    implementation("dev.arbjerg:lavalink-client:3.1.0")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    implementation 'io.github.cdimascio:dotenv-java:3.0.1'
    implementation group: 'me.duncte123', name: 'botCommons', version: '3.1.18'
}

test {
    useJUnitPlatform()
}
